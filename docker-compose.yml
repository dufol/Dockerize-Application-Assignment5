# This is a sample docker-compose file for a Node.js application with a MongoDB database.
version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_PATH=/app/data/recipes.db
  volumes:
    -backend-data:/app/data

  frontend:
      context: ./frontend
      args:
        - REACT_APP_BACKEND_URL=http://backend:5000
      
      ports:
        - "3000:80"
      depends_on:
        - backend
volumes:
  -frontend-data:/app/data

