
# Set up the backend and frontend services
services:

  # Backend API
  backend:
    build: ./backend
    ports:
      - "5001:5000"  # Connect Mac port 5001 to container port 5000
    environment:
      - PORT=5000  # Port the backend runs on
      - DB_PATH=/app/data/recipes.db  # Location of the recipe database
    volumes:
      - backend_data:/app/data  # Save database data even if the container stops

  # Frontend application
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5001  # Connect frontend to the backend API
    ports:
      - "3001:80"  # Connect Mac port 3001 to Nginx port 80
    depends_on:
      - backend  # Start the backend before the frontend

# Store database data using a named volume
volumes:
  backend_data:
